name: Build & Push

on:
  workflow_dispatch:

  push:
    branches:
      - test

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/daw-web:latest

      - name: Levantar contenedor
        run: |
          docker rm -f daw-web-container 2>$null
          docker run -d -p 8888:80 --name daw-web-container ${{ vars.DOCKERHUB_USERNAME }}/daw-web:latest
